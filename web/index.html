<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>青山 · 一屏山色</title>
    <style>
        /* ===== 全局变量 ===== */
        :root {
            --xuan: #17181a;
            --xuan-deep: #1f2120;
            --ink: #e8e2d2;
            --zhusha: #c5544a;
            --cloud: #3a3d38;
            --sky-top: #202422;
            --sky-bottom: #14100f;
            --peak-far: #4a5652;
            --peak-mid: #232b28;
            --peak-near: #0b0a09;
            --mist: #6e7873;
            --hero-text: #f5efe1;
            --seal-glyph: #f5efe1;
            --moon-glow: #d7e1dc;
            --rim-stroke-sm: url(#moonGradSm);
            --breathe-play: paused;
            --breathe-anim: none;
            --font-display: "Kaiti SC", "STKaiti", "KaiTi", "Baoli SC", serif;
            --font-body: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
            --font-ui: "PingFang SC", "Microsoft YaHei", "Heiti SC", "Helvetica Neue", Arial, sans-serif;
            --paper-opacity: 0.06;
            --paper-blend: screen;
            transition: background 0.4s ease, color 0.4s ease;
        }

        :root[data-theme="light"] {
            --xuan: #ede6d8;
            --xuan-deep: #e4dbc8;
            --ink: #23231f;
            --zhusha: #a13b2e;
            --cloud: #c9c2b3;
            --sky-top: #e9e1d1;
            --sky-bottom: #d8cdb8;
            --peak-far: #9fb0ac;
            --peak-mid: #5c7268;
            --peak-near: #23231f;
            --mist: #ede6d8;
            --rim-stroke-sm: none;
            --breathe-play: running;
            --paper-opacity: 0.05;
            --paper-blend: multiply;
        }

        :root[data-theme="light"] #peakRim {
            display: none;
        }
        :root[data-theme="light"] .moon {
            background: radial-gradient(circle, #ffd98a 0 38%, transparent 40%),
                radial-gradient(circle, rgba(255, 197, 110, 0.55) 0%, transparent 70%);
        }

        * {
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            margin: 0;
        }
        body {
            position: relative;
            background: var(--xuan);
            color: var(--ink);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* ===== 宣纸纹理 ===== */
        .paper-grain {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 400;
            pointer-events: none;
            opacity: var(--paper-opacity);
            mix-blend-mode: var(--paper-blend);
        }

        /* ===== Hero 主容器 ===== */
        .hero {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: flex-end;
            overflow: hidden;
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
        }

        /* ===== 山峦 ===== */
        .hero-art {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .hero-art .peak-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        .hero-art .peak-layer svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .peak-far {
            fill: var(--peak-far);
            animation: var(--breathe-anim);
            animation-play-state: var(--breathe-play);
        }
        .peak-mid {
            fill: var(--peak-mid);
            animation: var(--breathe-anim);
            animation-delay: -0.6s;
            animation-play-state: var(--breathe-play);
        }
        .peak-near {
            fill: var(--peak-near);
            animation: var(--breathe-anim);
            animation-delay: -1.3s;
            animation-play-state: var(--breathe-play);
        }
        .mist {
            fill: var(--mist);
            opacity: 0.5;
        }
        .peak-rim {
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .peak-rim-sm {
            stroke: var(--rim-stroke-sm);
            stroke-width: 0.8;
            stroke-dasharray: 25 500;
            animation: var(--ridge-anim);
        }

        @keyframes ridgeFlow {
            to {
                stroke-dashoffset: -525;
            }
        }

        /* ===== 月亮 / 主题切换 ===== */
        .moon {
            position: absolute;
            top: 11%;
            left: max(9vw, calc(50vw - 900px));
            z-index: 10;
            width: 90px;
            aspect-ratio: 1;
            border-radius: 50%;
            border: none;
            padding: 0;
            cursor: grab;
            touch-action: none;
            background: radial-gradient(circle, var(--moon-glow) 0 38%, transparent 40%),
                radial-gradient(circle, color-mix(in srgb, var(--moon-glow) 50%, transparent) 0%, transparent 70%);
            transition: background 0.4s ease;
        }
        .moon.is-dragging {
            cursor: grabbing;
        }

        /* ===== 底部入口文字 ===== */
        .hero-content {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 2rem;
            padding: 0 clamp(1.25rem, 5vw, 3rem) clamp(3rem, 8vw, 5rem);
            opacity: 0;
            transform: translateY(18px);
            animation: heroIn 1s ease 0.15s forwards;
            pointer-events: none;
        }
        .hero-content .cta {
            pointer-events: auto;
        }

        @keyframes heroIn {
            to {
                opacity: 1;
                transform: none;
            }
        }

        .hero-left {
            max-width: 22rem;
            margin-left: max(-20rem, calc(clamp(0.75rem, 3vw, 2.25rem) - (clamp(1.25rem, 5vw, 3rem) + max(0px, 50vw - 600px))));
        }

        .tagline {
            font-family: var(--font-body);
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            color: var(--hero-text);
            margin: 0 0 2rem;
            letter-spacing: 0.05em;
        }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .cta {
            display: inline-block;
            border: 1px solid var(--hero-text);
            color: var(--hero-text);
            background: none;
            cursor: pointer;
            padding: 0.75em 1.75em;
            font-family: var(--font-ui);
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            position: relative;
            transition: color 0.3s, border-color 0.3s;
        }
        .cta::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -1px;
            width: 0;
            height: 2px;
            background: var(--zhusha);
            transition: width 0.3s ease;
        }
        .cta:hover,
        .cta:focus-visible {
            border-color: var(--zhusha);
            color: var(--zhusha);
        }
        .cta:hover::after,
        .cta:focus-visible::after {
            width: 100%;
        }

        .seal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            flex: 0 0 auto;
            background: var(--zhusha);
            color: var(--seal-glyph);
            font-family: var(--font-display);
            font-size: 20px;
            letter-spacing: 0.1em;
            writing-mode: vertical-rl;
            transform: rotate(-3deg);
            box-shadow: 0 2px 8px var(--shadow);
            clip-path: polygon(6% 2%, 94% 0%, 100% 20%, 97% 45%, 100% 80%, 94% 98%, 6% 100%, 0% 80%, 3% 45%, 0% 20%);
        }

        /* ===== 沉浸式画卷 ===== */
        .scroll-container {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            padding: 0.6rem;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .scroll-container.active {
            pointer-events: auto;
            opacity: 1;
        }

        .scroll-roll {
            position: relative;
            width: 100%;
            max-width: 96vw;
            max-height: 94vh;
            background: var(--xuan);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65), 0 0 0 1px var(--xuan-deep), 0 0 0 3px var(--cloud);
            border-radius: 6px 6px 0 0;
            transform: scale(0.94) translateY(20px);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s;
            padding: 0.5rem 0.5rem 0.6rem;
            overflow: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .scroll-roll::-webkit-scrollbar {
            display: none;
        }
        .scroll-container.active .scroll-roll {
            transform: scale(1) translateY(0);
        }

        /* 卷轴轴头 */
        .scroll-roll::before,
        .scroll-roll::after {
            content: "";
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 102%;
            height: 12px;
            background: radial-gradient(ellipse at 30% 50%, #c9ad8a, #7a5f44);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            z-index: 2;
        }
        .scroll-roll::before {
            top: -6px;
        }
        .scroll-roll::after {
            bottom: -6px;
        }

        /* ===== 图片区域 ===== */
        .gallery-wrap {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .gallery-frame {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 300px;
            border-radius: 6px;
            overflow: hidden;
            background: var(--xuan-deep);
            cursor: pointer;
            aspect-ratio: 16 / 9;
        }

        .gallery-slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            transform: scale(1.02);
        }
        .gallery-slide.active {
            opacity: 1;
            transform: scale(1);
        }

        /* ===== 箭头 ===== */
        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.85);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.4rem;
            transition: background 0.25s, transform 0.2s, opacity 0.3s;
            user-select: none;
            touch-action: manipulation;
            opacity: 0;
        }
        .scroll-container.active .gallery-arrow {
            opacity: 1;
        }
        .gallery-arrow:hover {
            background: rgba(0, 0, 0, 0.5);
        }
        .gallery-arrow:active {
            transform: translateY(-50%) scale(0.92);
        }
        .gallery-arrow.prev {
            left: 12px;
        }
        .gallery-arrow.next {
            right: 12px;
        }

        /* ===== 左上角标题 ===== */
        .gallery-badge {
            position: absolute;
            top: 18px;
            left: 20px;
            z-index: 4;
            font-family: var(--font-display);
            font-size: clamp(1.4rem, 2.8vw, 2.4rem);
            color: #fff;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.7);
            letter-spacing: 0.08em;
            opacity: 0.9;
            pointer-events: none;
            font-weight: 400;
        }

        /* ===== 右上角页码 ===== */
        .gallery-counter {
            position: absolute;
            top: 20px;
            right: 22px;
            z-index: 4;
            font-family: var(--font-ui);
            font-size: clamp(0.8rem, 1.2vw, 1rem);
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 0.2rem 0.9rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            pointer-events: none;
            letter-spacing: 0.04em;
        }

        /* ===== 底部诗句叠加 ===== */
        .gallery-poem-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 4;
            padding: 1.8rem 1.8rem 1rem;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.5) 50%, rgba(0, 0, 0, 0.7));
            pointer-events: none;
            text-align: center;
        }
        .gallery-poem-overlay .poem-line {
            display: block;
            font-family: var(--font-display);
            color: #f5efe1;
            font-size: clamp(1.2rem, 2.6vw, 2rem);
            letter-spacing: 0.12em;
            line-height: 2;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
        }
        .gallery-poem-overlay .poem-source {
            display: block;
            font-family: var(--font-body);
            font-size: clamp(0.55rem, 0.9vw, 0.75rem);
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.15em;
            margin-top: 0.2rem;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
        }

        /* ===== 底部落款 ===== */
        .gallery-footer-overlay {
            position: absolute;
            bottom: 0.8rem;
            right: 1.2rem;
            z-index: 4;
            font-family: var(--font-body);
            font-size: clamp(0.5rem, 0.8vw, 0.7rem);
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.25em;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }

        /* ===== 指示点 —— 移到诗句下方 ===== */
        .gallery-dots-overlay {
            position: absolute;
            bottom: 3.2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            display: flex;
            gap: 7px;
            pointer-events: auto;
        }
        .gallery-dots-overlay span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        .gallery-dots-overlay span.active {
            background: #f5efe1;
            opacity: 0.95;
            transform: scale(1.35);
        }
        .gallery-dots-overlay span:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        /* ===== 底部操作栏（尺寸 + 保存按钮） ===== */
        .gallery-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0.3rem 0.2rem 0;
            flex-shrink: 0;
            gap: 0.5rem;
        }
        .gallery-actions .info {
            font-family: var(--font-ui);
            font-size: clamp(0.55rem, 0.8vw, 0.7rem);
            color: var(--ink);
            opacity: 0.35;
            letter-spacing: 0.04em;
        }
        .gallery-actions .save-btn {
            font-family: var(--font-ui);
            font-size: clamp(0.55rem, 0.8vw, 0.7rem);
            color: var(--ink);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0.25rem 0.9rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.06em;
            opacity: 0.5;
        }
        .gallery-actions .save-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            opacity: 0.9;
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .hero-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 1.5rem;
            }
            .hero-left {
                margin-left: 0;
                max-width: 100%;
            }
            .moon {
                width: 60px;
                top: 6%;
                left: auto;
                right: 5%;
            }
            .scroll-roll {
                padding: 0.4rem 0.3rem 0.5rem;
                max-width: 100vw;
                max-height: 98vh;
                border-radius: 4px 4px 0 0;
            }
            .scroll-roll::before,
            .scroll-roll::after {
                width: 102%;
                height: 8px;
            }
            .scroll-roll::before {
                top: -4px;
            }
            .scroll-roll::after {
                bottom: -4px;
            }
            .gallery-frame {
                min-height: 200px;
                aspect-ratio: 16 / 9;
            }
            .gallery-arrow {
                width: 32px;
                height: 32px;
                font-size: 1rem;
            }
            .gallery-arrow.prev {
                left: 6px;
            }
            .gallery-arrow.next {
                right: 6px;
            }
            .gallery-badge {
                top: 12px;
                left: 14px;
                font-size: 1.2rem;
            }
            .gallery-counter {
                top: 12px;
                right: 14px;
                font-size: 0.65rem;
                padding: 0.1rem 0.6rem;
            }
            .gallery-poem-overlay {
                padding: 1.2rem 1rem 0.8rem;
            }
            .gallery-poem-overlay .poem-line {
                font-size: 0.9rem;
                line-height: 1.8;
            }
            .gallery-poem-overlay .poem-source {
                font-size: 0.5rem;
            }
            .gallery-dots-overlay {
                bottom: 2.6rem;
                gap: 5px;
            }
            .gallery-dots-overlay span {
                width: 6px;
                height: 6px;
            }
            .gallery-footer-overlay {
                bottom: 0.5rem;
                right: 0.8rem;
                font-size: 0.45rem;
            }
            .gallery-actions .info {
                font-size: 0.5rem;
            }
            .gallery-actions .save-btn {
                font-size: 0.5rem;
                padding: 0.15rem 0.6rem;
            }
        }

        @media (max-width: 400px) {
            .gallery-frame {
                min-height: 150px;
                aspect-ratio: 16 / 9;
            }
            .gallery-poem-overlay .poem-line {
                font-size: 0.8rem;
                line-height: 1.6;
            }
            .gallery-arrow {
                width: 28px;
                height: 28px;
                font-size: 0.8rem;
            }
            .gallery-dots-overlay {
                bottom: 2.2rem;
            }
        }

        /* ===== 呼吸动画 ===== */
        @keyframes breatheFar {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.008);
            }
        }
        @keyframes breatheMid {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.012);
            }
        }
        @keyframes breatheNear {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.016);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .hero,
            .hero-art,
            .hero-content,
            .scroll-container,
            .scroll-roll,
            .gallery-slide {
                transition: none !important;
                animation: none !important;
            }
            .hero-content {
                opacity: 1;
                transform: none;
            }
            .scroll-container.active .scroll-roll {
                transform: none;
            }
            .gallery-slide.active {
                opacity: 1;
            }
            .gallery-slide {
                opacity: 0;
                transform: none;
            }
            .gallery-slide.active {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>
<body>

    <!-- 宣纸纹理 -->
    <svg class="paper-grain" aria-hidden="true">
        <filter id="paperNoise">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" />
        </filter>
        <rect width="100%" height="100%" filter="url(#paperNoise)" />
    </svg>

    <!-- ===== Hero 主区域 ===== -->
    <section class="hero" id="hero">

        <div class="hero-art" id="heroArt">
            <div class="peak-layer">
                <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
                    <defs>
                        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="var(--sky-top)" />
                            <stop offset="1" stop-color="var(--sky-bottom)" />
                        </linearGradient>
                        <filter id="softBlur">
                            <feGaussianBlur stdDeviation="9" />
                        </filter>
                        <linearGradient id="moonGradSm" gradientUnits="userSpaceOnUse" x1="0" y1="115" x2="0" y2="175">
                            <stop offset="0" stop-color="var(--moon-glow)" stop-opacity=".85" />
                            <stop offset="1" stop-color="var(--moon-glow)" stop-opacity="0" />
                        </linearGradient>
                    </defs>
                    <rect width="400" height="300" fill="url(#skyGrad)" />
                    <path class="peak-far" d="M0,190 C60,170 120,180 180,175 C240,170 300,185 360,178 C380,176 390,178 400,177 L400,300 L0,300 Z" />
                    <ellipse class="mist" cx="90" cy="185" rx="70" ry="9" filter="url(#softBlur)" />
                    <path class="peak-mid" d="M0,210 C50,160 100,150 150,175 C190,195 220,200 260,170 C300,140 340,150 380,175 C390,180 395,183 400,178 L400,300 L0,300 Z" />
                    <ellipse class="mist" cx="260" cy="203" rx="90" ry="11" filter="url(#softBlur)" />
                    <path class="peak-near" d="M0,240 C40,190 80,150 120,135 C150,122 170,145 200,165 C230,185 250,195 280,170 C310,145 340,120 370,140 C385,150 393,158 400,155 L400,300 L0,300 Z" />
                    <path class="peak-rim peak-rim-sm" id="peakRim"
                    d="M0,240 C40,190 80,150 120,135 C150,122 170,145 200,165 C230,185 250,195 280,170 C310,145 340,120 370,140 C385,150 393,158 400,155" />
                </svg>
            </div>
        </div>

        <button class="moon" id="themeToggle" aria-label="切换明暗主题"></button>

        <div class="hero-content">
            <div class="hero-left">
                <p class="tagline">一屏山色，四时云烟</p>
                <div class="hero-actions">
                    <button class="cta" id="expandBtn">展开画卷</button>
                    <span class="seal">青山</span>
                </div>
            </div>
        </div>

    </section>

    <!-- ===== 沉浸式画卷 ===== -->
    <div class="scroll-container" id="scrollContainer">
        <div class="scroll-roll">

            <div class="gallery-wrap">

                <!-- 图片轮播 -->
                <div class="gallery-frame" id="galleryFrame">
                    <!-- 图片由 JS 动态生成 -->

                    <!-- 箭头 -->
                    <button class="gallery-arrow prev" id="prevBtn" aria-label="上一张">‹</button>
                    <button class="gallery-arrow next" id="nextBtn" aria-label="下一张">›</button>

                    <!-- 左上角标题 -->
                    <div class="gallery-badge" id="galleryBadge">山</div>

                    <!-- 右上角页码 -->
                    <div class="gallery-counter" id="galleryCounter">1/6</div>

                    <!-- 底部诗句 -->
                    <div class="gallery-poem-overlay" id="poemOverlay">
                        <span class="poem-line" id="poemLine1">远上寒山石径斜</span>
                        <span class="poem-line" id="poemLine2">白云生处有人家</span>
                        <span class="poem-source" id="poemSource">—— 杜牧《山行》</span>
                    </div>

                    <!-- 底部落款 -->
                    <div class="gallery-footer-overlay">古法丹青 · 今时屏色</div>

                    <!-- 指示点（已下移，不再遮挡诗句） -->
                    <div class="gallery-dots-overlay" id="dotContainer"></div>
                </div>

                <!-- 底部操作栏 -->
                <div class="gallery-actions">
                    <span class="info" id="imageSize">1920 × 1080</span>
                    <button class="save-btn" id="saveBtn">保存原图</button>
                </div>

            </div>

        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== 壁纸数据 =====
            const wallpapers = [{
                id: 0,
                url: 'https://images.unsplash.com/photo-1527668752968-14dc70a27c95?q=80&w=1470',
                badge: '山',
                line1: '远上寒山石径斜',
                line2: '白云生处有人家',
                source: '—— 杜牧《山行》',
                size: '1920 × 1080'
            }, {
                id: 1,
                url: 'https://images.unsplash.com/photo-1532676554632-c26a490c144f?q=80&w=1470',
                badge: '云',
                line1: '只在此山中',
                line2: '云深不知处',
                source: '—— 贾岛《寻隐者不遇》',
                size: '1920 × 1080'
            }, {
                id: 2,
                url: 'https://images.unsplash.com/photo-1689857272599-d8352477b250?q=80&w=1451',
                badge: '海',
                line1: '海上生明月',
                line2: '天涯共此时',
                source: '—— 张九龄《望月怀远》',
                size: '1920 × 1080'
            }, {
                id: 3,
                url: 'https://images.unsplash.com/photo-1692371739345-6d65d3649c32?q=80&w=1470',
                badge: '星',
                line1: '天阶夜色凉如水',
                line2: '坐看牵牛织女星',
                source: '—— 杜牧《秋夕》',
                size: '1920 × 1080'
            }, {
                id: 4,
                url: 'https://images.unsplash.com/photo-1440581572325-0bea30075d9d?q=80&w=1374',
                badge: '林',
                line1: '空山新雨后',
                line2: '天气晚来秋',
                source: '—— 王维《山居秋暝》',
                size: '1920 × 1080'
            }, {
                id: 5,
                url: 'https://images.unsplash.com/photo-1730193178716-3d19b3e81e5d?q=80&w=1503',
                badge: '霞',
                line1: '落霞与孤鹜齐飞',
                line2: '秋水共长天一色',
                source: '—— 王勃《滕王阁序》',
                size: '1920 × 1080'
            }];

            let currentIndex = 0;
            const frame = document.getElementById('galleryFrame');
            const badge = document.getElementById('galleryBadge');
            const counter = document.getElementById('galleryCounter');
            const poemLine1 = document.getElementById('poemLine1');
            const poemLine2 = document.getElementById('poemLine2');
            const poemSource = document.getElementById('poemSource');
            const dotContainer = document.getElementById('dotContainer');
            const imageSize = document.getElementById('imageSize');

            // ===== 渲染图片 =====
            function renderSlides() {
                const existing = frame.querySelectorAll('.gallery-slide');
                existing.forEach(el => el.remove());

                wallpapers.forEach((item, idx) => {
                    const img = document.createElement('img');
                    img.src = item.url;
                    img.alt = item.badge;
                    img.className = `gallery-slide ${idx === currentIndex ? 'active' : ''}`;
                    img.loading = 'lazy';
                    img.onerror = function() {
                        this.style.background = '#2a2a2a';
                        this.alt = '加载失败';
                    };
                    frame.appendChild(img);
                });

                // 指示点
                dotContainer.innerHTML = '';
                wallpapers.forEach((_, idx) => {
                    const dot = document.createElement('span');
                    dot.className = idx === currentIndex ? 'active' : '';
                    dot.dataset.index = idx;
                    dot.addEventListener('click', (e) => {
                        e.stopPropagation();
                        goTo(idx);
                    });
                    dotContainer.appendChild(dot);
                });

                updateInfo(currentIndex);
            }

            function updateInfo(index) {
                const data = wallpapers[index];
                badge.textContent = data.badge;
                counter.textContent = `${index + 1}/${wallpapers.length}`;
                poemLine1.textContent = data.line1;
                poemLine2.textContent = data.line2;
                poemSource.textContent = data.source;
                imageSize.textContent = data.size || '1920 × 1080';

                const dots = dotContainer.querySelectorAll('span');
                dots.forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                });
            }

            function goTo(index) {
                if (index === currentIndex) return;
                if (index < 0) index = wallpapers.length - 1;
                if (index >= wallpapers.length) index = 0;

                const slides = frame.querySelectorAll('.gallery-slide');
                slides.forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                });

                updateInfo(index);
                currentIndex = index;
            }

            function next() { goTo(currentIndex + 1); }

            function prev() { goTo(currentIndex - 1); }

            // ===== 点击图片切换 =====
            frame.addEventListener('click', function(e) {
                if (e.target.closest('.gallery-arrow') || e.target.closest('.gallery-dots-overlay') || e.target
                    .closest('.save-btn')) return;
                next();
            });

            // ===== 键盘控制 =====
            document.addEventListener('keydown', function(e) {
                const container = document.getElementById('scrollContainer');
                if (!container.classList.contains('active')) return;
                if (e.key === 'ArrowLeft') { e.preventDefault();
                    next(); }
                if (e.key === 'ArrowRight') { e.preventDefault();
                    prev(); }
            });

            // ===== 触摸滑动 =====
            let touchStartX = 0;
            frame.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            frame.addEventListener('touchend', function(e) {
                const diff = touchStartX - e.changedTouches[0].screenX;
                if (Math.abs(diff) > 40) {
                    diff > 0 ? next() : prev();
                }
            }, { passive: true });

            // ===== 保存按钮（模拟） =====
            document.getElementById('saveBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                const data = wallpapers[currentIndex];
                const link = document.createElement('a');
                link.href = data.url;
                link.download = `${data.badge}_${Date.now()}.jpg`;
                link.target = '_blank';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                this.textContent = '✓ 已保存';
                setTimeout(() => { this.textContent = '保存原图'; }, 1500);
            });

            // ===== 主题切换 =====
            const toggle = document.getElementById('themeToggle');
            const html = document.documentElement;

            function getStoredTheme() {
                try { return localStorage.getItem('qingshan-theme'); } catch (_) { return null; }
            }

            function setTheme(theme) {
                if (theme === 'light') {
                    html.setAttribute('data-theme', 'light');
                } else {
                    html.removeAttribute('data-theme');
                }
                try { localStorage.setItem('qingshan-theme', theme || 'dark'); } catch (_) {}
            }

            const stored = getStoredTheme();
            setTheme(stored === 'light' ? 'light' : 'dark');

            toggle.addEventListener('click', function(e) {
                e.stopPropagation();
                const current = html.getAttribute('data-theme');
                setTheme(current === 'light' ? 'dark' : 'light');
            });

            // ===== 月亮拖拽 =====
            let isDragging = false,
                startX, startY, originLeft, originTop;

            toggle.addEventListener('mousedown', function(e) {
                isDragging = true;
                toggle.classList.add('is-dragging');
                const rect = toggle.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                originLeft = rect.left;
                originTop = rect.top;
                e.preventDefault();
            });

            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                toggle.style.left = (originLeft + e.clientX - startX) + 'px';
                toggle.style.top = (originTop + e.clientY - startY) + 'px';
                toggle.style.position = 'fixed';
            });

            document.addEventListener('mouseup', function() {
                if (isDragging) {
                    isDragging = false;
                    toggle.classList.remove('is-dragging');
                }
            });

            let touchId = null;
            toggle.addEventListener('touchstart', function(e) {
                const touch = e.touches[0];
                if (!touch) return;
                isDragging = true;
                toggle.classList.add('is-dragging');
                const rect = toggle.getBoundingClientRect();
                startX = touch.clientX;
                startY = touch.clientY;
                originLeft = rect.left;
                originTop = rect.top;
                touchId = touch.identifier;
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('touchmove', function(e) {
                if (!isDragging) return;
                let touch = null;
                for (let t of e.changedTouches) {
                    if (t.identifier === touchId) { touch = t; break; }
                }
                if (!touch) return;
                toggle.style.left = (originLeft + touch.clientX - startX) + 'px';
                toggle.style.top = (originTop + touch.clientY - startY) + 'px';
                toggle.style.position = 'fixed';
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('touchend', function() {
                if (isDragging) {
                    isDragging = false;
                    toggle.classList.remove('is-dragging');
                    touchId = null;
                }
            });

            // ===== 呼吸动画 =====
            function updateBreathing() {
                const isLight = html.getAttribute('data-theme') === 'light';
                document.querySelectorAll('.peak-far, .peak-mid, .peak-near').forEach(el => {
                    if (isLight) {
                        const name = el.classList.contains('peak-far') ? 'breatheFar' :
                            el.classList.contains('peak-mid') ? 'breatheMid' : 'breatheNear';
                        el.style.animation = `${name} 6s ease-in-out infinite`;
                        el.style.animationPlayState = 'running';
                    } else {
                        el.style.animation = 'none';
                        el.style.animationPlayState = 'paused';
                    }
                });
            }
            const observer = new MutationObserver(m => {
                if (m.some(r => r.attributeName === 'data-theme')) updateBreathing();
            });
            observer.observe(html, { attributes: true });
            updateBreathing();

            // ===== 展开 / 收起 =====
            const expandBtn = document.getElementById('expandBtn');
            const scrollContainer = document.getElementById('scrollContainer');
            let isOpen = false;

            function openScroll() {
                isOpen = true;
                scrollContainer.classList.add('active');
                expandBtn.textContent = '收起画卷';
                document.body.style.overflow = 'hidden';
                const slides = frame.querySelectorAll('.gallery-slide');
                slides.forEach((img, idx) => {
                    if (idx !== currentIndex) img.src = wallpapers[idx].url;
                });
            }

            function closeScroll() {
                isOpen = false;
                scrollContainer.classList.remove('active');
                expandBtn.textContent = '展开画卷';
                document.body.style.overflow = '';
            }

            expandBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                isOpen ? closeScroll() : openScroll();
            });

            scrollContainer.addEventListener('click', function(e) {
                if (e.target === scrollContainer) closeScroll();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && isOpen) closeScroll();
            });

            // ===== 箭头事件 =====
            document.getElementById('prevBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                prev();
            });
            document.getElementById('nextBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                next();
            });

            // ===== 窗口 resize 重置月亮 =====
            window.addEventListener('resize', function() {
                if (toggle.style.position === 'fixed') {
                    toggle.style.position = 'absolute';
                    toggle.style.left = '';
                    toggle.style.top = '';
                }
            });

            // ===== 启动 =====
            renderSlides();

        })();
    </script>

</body>
</html>
